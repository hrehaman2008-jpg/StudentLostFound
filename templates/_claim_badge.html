{# Status badge for a claim. Expects: claim #}
{% if claim.status == 'Approved' %}
<span class="badge text-bg-success"><i class="bi bi-check2-circle me-1"></i>Approved</span>
{% elif claim.status == 'Rejected' %}
<span class="badge text-bg-danger"><i class="bi bi-x-circle me-1"></i>Rejected</span>
{% else %}
<span class="badge text-bg-info"><i class="bi bi-hourglass-split me-1"></i>Pending</span>
{% endif %}
